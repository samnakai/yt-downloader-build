name: Build YT Downloader

on:
  workflow_dispatch:
  push:
    paths:
      - 'yt_downloader_web.py'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yt-dlp imageio-ffmpeg pyinstaller flask
      - run: pyinstaller --noconfirm --windowed --onefile --name "YT Downloader" yt_downloader_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Windows
          path: dist/YT Downloader.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yt-dlp imageio-ffmpeg pyinstaller flask
      - run: pyinstaller --noconfirm --windowed --onefile --name "YT Downloader" yt_downloader_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-macOS
          path: dist/YT Downloader
